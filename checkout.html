<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>توصيل – ST SHOP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-dark" style="background:var(--primary)">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ST SHOP</a>
    <a href="cart.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> السلة</a>
  </div>
</nav>

<div class="container py-5">
  <h1 class="text-center mb-4">معلومات الشحن</h1>
  <form id="shipForm">
    <div class="row g-3">
      <div class="col-sm-6"><label class="form-label">الاسم الكامل *</label><input class="form-control" id="fullname" required></div>
      <div class="col-sm-6"><label class="form-label">رقم الهاتف *</label><input type="tel" class="form-control" id="phone" required></div>

      <div class="col-sm-6"><label class="form-label">الولاية *</label>
        <select class="form-select" id="province" required></select></div>
      <div class="col-sm-6"><label class="form-label">البلدية/المدينة *</label><input class="form-control" id="city" required></div>

      <div class="col-12"><label class="form-label">العنوان (مبسط)</label><textarea class="form-control" id="address" rows="3"></textarea></div>

      <div class="col-sm-6"><label class="form-label">نوع الموقع *</label>
        <select class="form-select" id="siteType" required>
          <option value="">اختر</option>
          <option value="office">مكتب (Stop‑Desk)</option>
          <option value="home">منزل (Domicile)</option>
        </select></div>
      <div class="col-sm-6"><label class="form-label">الوزن الإجمالي (كغ) *</label><input type="number" step="0.01" min="0.1" class="form-control" id="totalWeight" required></div>
    </div>

    <!-- تقدير التوصيل -->
    <div class="alert alert-info mt-4 d-none" id="costCalc">
      <i class="bi bi-info-circle-fill"></i> <span id="rangeDisplay"></span>
      <input type="hidden" id="minCost"><input type="hidden" id="maxCost">
    </div>

    <div class="d-flex justify-content-between mt-4">
      <a href="cart.html" class="btn btn-outline-secondary">العودة إلى السلة</a>
      <button type="submit" class="btn btn-primary">تأكيد الطلب</button>
    </div>
  </form>

  <!-- رسـالة النجاح -->
  <div class="alert alert-success mt-4 d-none" id="successMsg">
    <h4 class="fw-bold">تم تأكيد الطلب!</h4>
    <p>رقم الطلب: <strong id="orderNo"></strong></p>
    <p>سوف نصل إليك على رقم <strong id="confirmPhone"></strong> خلال 24 ساعة.</p>
    <a href="index.html" class="btn btn-primary btn-lg mt-3">العودة للمتجر</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js.js"></script>
<script>
  /* ----------  شيفرة تسجيل الولايات ---------- */
  const states = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة",
                  "تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة",
                  "سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر",
                  "ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت",
                  "الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت",
                  "غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام",
                  "تقرت","جانت","المغير","المنيعة"];
  const sel=document.getElementById('province');
  sel.innerHTML=states.map((s,i)=>`<option value="${s}">${i+1} – ${s}</option>`).join('');

  /* ----------  حساب التوصيل (ثابت) ---------- */
  function recalc(){
    const weight=parseFloat(document.getElementById('totalWeight').value)||0;
    const pt=document.getElementById('siteType').value;
    if(!weight||!pt){document.getElementById('costCalc').classList.add('d-none');return;}
    /*   قيمة ثابتة: مكتوب 60000 أو 90000 حسب الموقع  */
    const min=pt==='office'?60000:90000;
    const max=min;
    document.getElementById('rangeDisplay').textContent=`من ${toCurrency(min)} إلى ${toCurrency(max)} (الولايات الجليفة)`;
    document.getElementById('minCost').value=min; document.getElementById('maxCost').value=max;
    document.getElementById('costCalc').classList.remove('d-none');
  }
  document.getElementById('totalWeight').addEventListener('input',recalc);
  document.getElementById('siteType').addEventListener('change',recalc);

  /* ----------  تأكيد الطلب ---------- */
  document.getElementById('shipForm').addEventListener('submit', e=>{
    e.preventDefault();
    if(!JSON.parse(localStorage.getItem('cart')||'[]').length){toast('السلة فارغة','bg-danger');return;}

    const cart=JSON.parse(localStorage.getItem('cart'));
    const order={
      id:Date.now(),
      fullname:document.getElementById('fullname').value.trim(),
      phone:document.getElementById('phone').value.trim(),
      province:document.getElementById('province').value,
      city:document.getElementById('city').value.trim(),
      address:document.getElementById('address').value.trim(),
      siteType:document.getElementById('siteType').value,
      totalWeight:parseFloat(document.getElementById('totalWeight').value),
      shipping:{min:document.getElementById('minCost').value, max:document.getElementById('maxCost').value},
      products:cart,
      total:cart.reduce((s,i)=>s+i.price*i.qty,0),
      status:'جديد',
      date:new Date().toLocaleString('ar-DZ')
    };
    Order.add(order); Cart.empty(); document.getElementById('shipForm').reset(); document.getElementById('costCalc').classList.add('d-none');
    document.getElementById('successMsg').classList.remove('d-none');
    document.getElementById('orderNo').textContent=`#${order.id}`;
    document.getElementById('confirmPhone').textContent=order.phone;
  });
</script>
</body>
</html>
