<details open><summary>cart.html</summary>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>السلة – ST SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ST SHOP</a>
    <a href="index.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> العودة للمتجر</a>
  </div>
</nav>

<div class="container py-5">
  <h1 class="text-center mb-4">سلة الشراء</h1>
  <div id="cartArea"></div>
  <div class="text-end mt-4">
    <h4 class="fw-bold">الإجمالي: <span id="total">0 دج</span></h4>
    <a href="checkout.html" class="btn btn-primary mt-3">تأكيد الطلب</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="scripts/main.js"></script>
<script>
  function renderCart(){
    const cart=Cart.all();
    const area=document.getElementById('cartArea');
    if(!cart.length){
      area.innerHTML='<div class="text-center py-5"><i class="bi bi-cart-x fs-5"></i> السلة فارغة. <a href="index.html" class="btn btn-outline-primary mt-3">التسوق الآن</a></div>';
      document.getElementById('total').textContent='0 دج';
      return;
    }
    area.innerHTML=cart.map(p=>`
      <div class="d-flex justify-content-between align-items-center mb-3 p-3 border rounded-3" style="background:#fff;">
        <img src="${p.image}" alt="${p.name}" width="90" height="90" class="rounded">
        <div class="flex-grow-1 ms-3">
          <h5 class="mb-0">${p.name}</h5>
          <small class="text-muted">الوزن: ${p.weight?p.weight+' كغ':''}</small>
        </div>
        <div class="d-flex align-items-center">
          <button class="btn btn-sm btn-outline-secondary" onclick="Cart.changeQty(${p.id},-1)">-</button>
          <input type="text" readonly class="mx-2 form-control form-control-sm" value="${p.qty}" style="width:60px;">
          <button class="btn btn-sm btn-outline-secondary" onclick="Cart.changeQty(${p.id},1)">+</button>
        </div>
        <div class="ms-4 fw-bold">${toCurrency(p.price*p.qty)}</div>
        <button class="btn btn-sm btn-danger ms-3" onclick="Cart.remove(${p.id})"><i class="bi bi-trash"></i></button>
      </div>
    `).join('');
    document.getElementById('total').textContent=toCurrency(Cart.total());
  }
  renderCart();
</script>
</body>
</html>
</details>
