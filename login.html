<details open><summary>admin/login.html</summary>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin Login | ST SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--primary:#1e1e2e;--secondary:#ff7a5e;--bg:#0f0f11;--card:#1f1f23;--text:#e2e8f0}
    body{font-family:'Segoe UI','Tajawal',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:var(--card);border-radius:.75rem;box-shadow:0 10px 20px rgba(0,0,0,.7);overflow:hidden;width:100%;max-width:380px}
    .card-header{background:var(--primary);color:white;padding:1rem;text-align:center;font-weight:600;font-size:1.35rem}
    .btn-primary{background:var(--secondary);border:none;color:white}
    .btn-primary:hover{background:#ff6e3d}
    .form-label{color:white}
    .text-danger{margin-top:.25rem;font-size:.875rem}
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">ST SHOP – Admin</div>
  <div class="card-body">
    <form id="loginForm">
      <div class="mb-3"><label class="form-label">اسم المستخدم</label>
        <input class="form-control" id="user" required></div>
      <div class="mb-3"><label class="form-label">كلمة المرور</label>
        <input type="password" class="form-control" id="pass" required></div>
      <div id="msg" class="text-danger d-none"></div>
      <button type="submit" class="btn btn-primary w-100 mt-3">تسجيل دخول</button>
    </form>
  </div>
</div>

<script src="../scripts/main.js"></script>
<script>
  const form=document.getElementById('loginForm');
  const msg=document.getElementById('msg');

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const u=form.user.value.trim();
    const p=form.pass.value.trim();

    // معطيات مطابقة مع ADMIN
    if(u===ADMIN.user && p===ADMIN.pass){
      sessionStorage.setItem('adminLogged','true');
      const next=decodeURIComponent(new URLSearchParams(location.search).get('next')||'/admin/dashboard.html');
      window.location.href=next;
    }else{
      msg.textContent='خطأ في اسم أو كلمة السر'; msg.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
