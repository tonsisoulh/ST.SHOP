<details open><summary>admin/dashboard.html</summary>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | ST SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--primary:#1e1e2e;--accent:#29c6f6;--hl:#ff7a5e;--bg:#0f0f11;--card:#1f1f23;--text:#e2e8f0}
    body{font-family:'Segoe UI','Tajawal',sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0}
    .navbar{background:var(--primary)}
    .navbar .navbar-brand{color:white;font-weight:600}
    .nav-link{color:white;padding:0.5rem 1rem}
    .nav-link:hover{color:var(--accent)}
    .card{background:var(--card);border:1px solid var(--hl);border-left:5px solid transparent; transition:.3s}
    .card.active{border-left-color:var(--accent)}
    .btn-primary{background:var(--accent);color:white;border:none}
    .btn-primary:hover{background:#24b0de}
    .table thead{background:var(--primary)}
    .table thead th{color:white}
    .badge{border-radius:.5rem}
    .alert{background:var(--accent);color:white;border:none;margin-top:1rem}
  </style>
</head>
<body>
<script src="../scripts/main.js"></script>
<script>requireLogin('/admin/dashboard.html');</script>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin/dashboard.html">ST SHOP – Admin</a>
    <a href="/admin/login.html" class="btn btn-outline-light" onclick="logout()">تسجيل الخروج</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-4 mb-4">
    <div class="col-md-4"><div class="card p-4 active text-center"><h5>الطلبات <span class="badge bg-primary" id="ordersCount"></span></h5></div></div>
    <div class="col-md-4"><div class="card p-4 text-center"><h5>المبيعات <span class="badge bg-success" id="revenue"></span></h5></div></div>
    <div class="col-md-4"><div class="card p-4 text-center"><h5>المنتجات <span class="badge bg-secondary" id="productsCount"></span></h5></div></div>
  </div>

  <ul class="nav nav-tabs mb-3" id="adminTabs">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#orders">الطلبات</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#products">المنتجات</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#new">إضافة منتج</a></li>
  </ul>

  <div class="tab-content">
    <!-- tab orders -->
    <div class="tab-pane active show" id="orders">
      <div class="table-responsive"><table class="table table-hover"><thead><tr><th>#</th><th>العميل</th><th>السعر</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="ordersTable"></tbody></table></div>
    </div>

    <!-- tab products -->
    <div class="tab-pane" id="products">
      <div class="table-responsive"><table class="table table-hover"><thead><tr><th>صورة</th><th>الاسم</th><th>السعر</th><th>الكمية</th><th>الإجراءات</th></tr></thead><tbody id="productsTable"></tbody></table></div>
    </div>

    <!-- tab add product -->
    <div class="tab-pane" id="new">
      <!-- form embedded same as before -->
    </div>
  </div>
</div>

<script>
  /* ... (تفاصيل الإجابة السابقة) ... */
</script>
</body>
</html>
</details>
