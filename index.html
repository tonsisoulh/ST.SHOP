<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ST SHOP – المتجر</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ST SHOP</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navebarMenu"><span class="navbar-toggler-icon"></span></button>

    <div class="collapse navbar-collapse" id="navebarMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html"><i class="bi bi-cart3"></i> السلة <span class="badge bg-light text-dark" id="cartCount">0</span></a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html"><i class="bi bi-gear-fill"></i> الإدارة</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="jumbotron text-center">
  <h1 class="display-5">أهلاً بكم في ST SHOP</h1>
  <p class="lead">متجر إلكتروني متكامل، منتجات عالية الجودة وتوصيل سريع في جميع الولايات الجزائرية.</p>
  <a href="#products" class="btn btn-primary btn-lg"><i class="bi bi-shop-window"></i> استعرض المنتجات</a>
</header>

<div class="container py-5" id="products">
  <h2 class="text-center mb-4"><i class="bi bi-all-caps"></i> أحدث المنتجات</h2>
  <div class="row g-4" id="productGrid"></div>
</div>

<footer class="footer d-flex flex-column align-items-center">
  <div class="footer-logos d-flex mb-3">
    <a href="https://tiktok.com/@h10395_" target="_blank"><i class="bi bi-tiktok fs-4"></i></a>
    <a href="https://www.facebook.com/share/19KYW6JFgs/" target="_blank"><i class="bi bi-facebook fs-4"></i></a>
    <a href="https://www.facebook.com/share/1CZUdfjRbx/" target="_blank"><i class="bi bi-people fs-4"></i></a>
  </div>
  <p>© 2026 ST SHOP. جميع الحقوق محفوظة.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js.js"></script>
<script>
  /* بيانات العينة – احفظها في localStorage إذا غيرتها */
  const sampleProducts = [
    {id:1, name:"سماعة بلوتوث", price:35000, weight:0.2, image:"https://picsum.photos/id/237/400/300", desc:"مأثير صوت 10 أساسي، بطارية 10 ساعات"},
    {id:2, name:"ساعة ذكية", price:68000, weight:0.3, image:"https://picsum.photos/id/238/400/300", desc:"تصميم أنيق مع GPS ومراقبة اللياقة"},
    {id:3, name:"كابل شاحن 2 م", price:11000, weight:0.06, image:"https://picsum.photos/id/239/400/300", desc:"كابل سحري + الكابل USB‑C"},
    {id:4, name:"مكتب مستعمل", price:120000, weight:20, image:"https://picsum.photos/id/240/400/300", desc:"مكتب مكتبّ متنقل مع إضاءة LED"}  
  ];
  if(!localStorage.getItem('products')) localStorage.setItem('products', JSON.stringify(sampleProducts));

  /* ----------  هُندسة السلة ---------- */
  const cart = JSON.parse(localStorage.getItem('cart')||'[]'); // read cart
  function saveCart(){localStorage.setItem('cart', JSON.stringify(cart));}
  function updateCartCount(){document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0);}
  function addToCart(id){
    const prod=JSON.parse(localStorage.getItem('products')).find(p=>p.id===id);
    const ex=cart.find(i=>i.id===id);
    if(ex) ex.qty+=1; else cart.push({...prod, qty:1});
    saveCart(); updateCartCount(); toast(`تم إضافة "${prod.name}" للسلة`);
  }

  /* ----------  سرد المنتجات ---------- */
  function loadProducts(){
    const prods=JSON.parse(localStorage.getItem('products'));
    const grid=document.getElementById('productGrid');
    if(!prods.length){
      grid.innerHTML='<div class="col-12 text-center py-5"><i class="bi bi-box-seam fs-4"></i> لا توجد منتجات. الرجاء العودة للوحة الإدارة.</div>';
      return;
    }
    grid.innerHTML=prods.map(p=>`
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card shadow-sm">
          <img src="${p.image}" alt="${p.name}">
          <div class="card-body">
            <h5 class="card-title">${p.name}</h5>
            <p class="card-text">${p.desc.slice(0,70)}…</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="fw-bold">${toCurrency(p.price)}</span>
              <button class="btn btn-primary btn-sm" onclick="addToCart(${p.id})"><i class="bi bi-cart-plus"></i> أضف</button>
            </div>
          </div>
        </div>
      </div>
    `).join('');
    updateCartCount();
  }
  loadProducts();
</script>
</body>
</html>
