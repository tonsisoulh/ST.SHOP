<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Admin | ST SHOP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    /* شِلوك تسجيل الدخول */
    .login-card{max-width:400px;margin:auto;padding:1.5rem;background:var(--surface);border-radius:.75rem;box-shadow:var(--shadow)}
    .login-card .btn-primary{background:var(--accent)}
  </style>
</head>
<body>
<script src="js.js"></script>
<script>
  /*  1 ‑ تسجيل دخول المدير  */
  if(!sessionStorage.getItem('adminLogged')){
    document.body.innerHTML=`<div class="login-card">
      <h3 class="text-center mb-4">تسجيل دخول الوِدّار</h3>
      <form id="adminLogin"><div class="mb-3"><label class="form-label">اسم المستخدم</label><input class="form-control" id="user" required></div>
      <div class="mb-3"><label class="form-label">كلمة المرور</label><input type="password" class="form-control" id="pass" required></div>
      <div id="err" class="text-danger text-center d-none">خطأ في الاسم/كلمة المرور</div>
      <button class="btn btn-primary w-100 mt-3" type="submit">تسجيل دخول</button></form>
    </div>`;
    document.getElementById('adminLogin').addEventListener('submit',e=>{
      e.preventDefault();
      const u=document.getElementById('user').value.trim();
      const p=document.getElementById('pass').value.trim();
      if(u===ADMIN.user && p===ADMIN.pass){
        sessionStorage.setItem('adminLogged','true'); window.location.reload();
      }else{document.getElementById('err').classList.remove('d-none');}
    });
    return;
  }

  /* -----  لوحة الإدارة أعلاه ----- */
  function loadStats(){
    const ord=Order.all(); const prod=Product.all();
    document.getElementById('ordersCnt').textContent=ord.length;
    document.getElementById('revenue').textContent=toCurrency(ord.reduce((s,o)=>s+o.total,0));
    document.getElementById('productsCnt').textContent=prod.length;
  }
  function loadOrders(){
    const ord=Order.all(); const tbl=document.getElementById('ordersTbl');
    tbl.innerHTML=ord.length?ord.reverse().map(o=>`
      <tr><td>#${o.id}</td><td>${o.fullname}</td><td>${toCurrency(o.total)}</td><td>${o.status}</td><td>${o.date}</td></tr>
    `).join(''):`<tr><td colspan="5" class="text-center">لا توجد طلبات حتى الآن</td></tr>`;
  }
  function loadProducts(){
    const prod=Product.all(); const tbl=document.getElementById('productsTbl');
    tbl.innerHTML=prod.length?prod.map(p=>`
      <tr>
        <td><img src="${p.image}" width="70" height="70" class="rounded"></td>
        <td>${p.name}</td><td>${toCurrency(p.price)}</td><td>${p.qty||'--'}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-2" onclick="editProd(${p.id})">تعديل</button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteProd(${p.id})">حذف</button>
        </td>
      </tr>
    `).join(''):`<tr><td colspan="5" class="text-center">لا توجد منتجات</td></tr>`;
  }
  /* ----------  تعديل / حذف   ---------- */
  function editProd(id){
    const p=Product.all().find(x=>x.id===id);
    if(!p)return;
    document.getElementById('pName').value=p.name;
    document.getElementById('pPrice').value=p.price;
    document.getElementById('pWeight').value=p.weight;
    document.getElementById('pDesc').value=p.desc;
    document.getElementById('pSite').value=p.shipPoint||'office';
    document.getElementById('addForm').dataset.editId=id;
    document.querySelector('#addForm button').textContent='تحديث المنتج';
  }
  function deleteProd(id){
    if(!confirm('هل أنت متأكد من حذف المنتج؟'))return;
    Product.remove(id); loadProducts(); loadStats(); toast('تم حذف المنتج');
  }
  /* ----------  إضافة منتج   ---------- */
  document.getElementById('addForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const file=document.getElementById('pImg').files[0];
    let base64='';
    if(file){ base64=await new Promise(r=>{const fr=new FileReader();fr.onload=ev=>r(ev.target.result);fr.readAsDataURL(file);});}
    const prod={
      id:parseInt(document.getElementById('addForm').dataset.editId||'0')||Date.now(),
      name:document.getElementById('pName').value.trim(),
      price:parseInt(document.getElementById('pPrice').value),
      weight:parseFloat(document.getElementById('pWeight').value),
      desc:document.getElementById('pDesc').value.trim(),
      shipPoint:document.getElementById('pSite').value,
      image:base64||Product.all().find(p=>p.id===parseInt(document.getElementById('addForm').dataset.editId))?.image||'',
      qty:Product.all().find(p=>p.id===parseInt(document.getElementById('addForm').dataset.editId))?.qty||0
    };
    Product.save(prod);
    document.getElementById('addForm').reset(); delete document.getElementById('addForm').dataset.editId;
    loadProducts(); loadStats();
    toast('تم حفظ المنتج بنجاح');
  });

  /* -----  شِكلي الواجهة ---- */
  loadStats(); loadOrders(); loadProducts();
</script>

<nav class="navbar navbar-dark" style="background:var(--primary)">
  <div class="container-fluid">
    <a class="navbar-brand text-white" href="admin.html">ST SHOP – الإدارة</a>
    <a href="#" class="btn btn-outline-light" onclick="sessionStorage.removeItem('adminLogged');location.reload()">تسجيل الخروج</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row mb-4 g-4">
    <div class="col-md-4"><div class="card p-3 text-center"><h5>الطلبات <span class="badge bg-primary" id="ordersCnt"></span></h5></div></div>
    <div class="col-md-4"><div class="card p-3 text-center"><h5>المبيعات <span class="badge bg-success" id="revenue"></span></h5></div></div>
    <div class="col-md-4"><div class="card p-3 text-center"><h5>المنتجات <span class="badge bg-secondary" id="productsCnt"></span></h5></div></div>
  </div>

  <ul class="nav nav-tabs mb-3" id="adminTabs">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#ordersTab">الطلبات</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#productsTab">المنتجات</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#addTab">إضافة منتج</a></li>
  </ul>

  <div class="tab-content">
    <!-- طلبات -->
    <div class="tab-pane show active" id="ordersTab">
      <div class="table-responsive"><table class="table table-hover"><thead>
        <tr><th>#</th><th>العميل</th><th>السعر</th><th>الحالة</th><th>التاريخ</th></tr> </thead>
        <tbody id="ordersTbl"></tbody></table></div>
    </div>

    <!-- منتجات -->
    <div class="tab-pane" id="productsTab">
      <div class="table-responsive"><table class="table table-hover"><thead>
        <tr><th>صورة</th><th>الاسم</th><th>السعر</th><th>الكمية</th><th>الإجراءات</th></tr></thead>
        <tbody id="productsTbl"></tbody></table></div>
    </div>

    <!-- إضافة منتج -->
    <div class="tab-pane" id="addTab">
      <form id="addForm" enctype="multipart/form-data" class="pt-3">
        <div class="row g-3">
          <div class="col-6"><label class="form-label">الاسم *</label><input class="form-control" id="pName" required></div>
          <div class="col-6"><label class="form-label">السعر (دج) *</label><input type="number" min="0" class="form-control" id="pPrice" required></div>
          <div class="col-6"><label class="form-label">الوزن (كغ) *</label><input type="number" step="0.01" min="0" class="form-control" id="pWeight" required></div>
          <div class="col-6"><label class="form-label">الوصف *</label><textarea class="form-control" id="pDesc" rows="2" required></textarea></div>
          <div class="col-6"><label class="form-label">نقطة التوصيل *</label>
            <select class="form-select" id="pSite" required>
              <option value="office">مكتب (Stop‑Desk)</option>
              <option value="home">منزل (Domicile)</option>
            </select></div>
          <div class="col-6"><label class="form-label">صورة المنتج *</label><input type="file" class="form-control" id="pImg" accept="image/*" required></div>
          <div class="col-12 d-flex justify-content-end"><button type="submit" class="btn btn-primary">حفظ المنتج</button></div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
