<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة الإدارة | ST SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--primary:#6366f1;--primary-dark:#4f46e5;--accent:#10b981;}
    body{font-family:'Tajawal',sans-serif;background:#121212;color:white;}
    .nav-tabs .nav-link{color:white;}
    .nav-tabs .nav-link.active{background:var(--primary)!important;}
    .tab-content{background:#1f1f1f;padding:1.5rem;border-radius:.5rem;}
    .btn-primary{background:var(--primary);border:none;}
    .btn-primary:hover{background:var(--primary-dark);}
  </style>
</head>

<body>
<nav class="navbar navbar-dark" style="background:var(--primary);">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">ST SHOP – Admin</a>
    <a href="#" class="btn btn-outline-light" onclick="logout()">تسجيل الخروج</a>
  </div>
</nav>

<div class="container py-5">
  <ul class="nav nav-tabs mb-4" id="adminTabs">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#ordersTab">الطلبات</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#addProductTab">إضافة منتج</a></li>
  </ul>

  <div class="tab-content" id="adminTabContent">
    <!-- طلبات -->
    <div class="tab-pane show active" id="ordersTab">
      <h4>طلبك الأخير</h4>
      <div id="ordersList"></div>
    </div>

    <!-- إضافة منتج -->
    <div class="tab-pane" id="addProductTab">
      <h4>إضافة منتج جديد</h4>
      <form id="addProductForm" class="mt-3">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">الاسم*</label>
            <input type="text" class="form-control" id="pName" required></div>
          <div class="col-md-6"><label class="form-label">السعر (دج)*</label>
            <input type="number" min="1" class="form-control" id="pPrice" required></div>
          <div class="col-md-6"><label class="form-label">الوزن (كغ)*</label>
            <input type="number" step="0.01" min="0.1" class="form-control" id="pWeight" required></div>
          <div class="col-md-6"><label class="form-label">وصف*</label>
            <textarea class="form-control" id="pDesc" rows="2" required></textarea></div>
          <div class="col-md-6"><label class="form-label">نقطة التوصيل*</label>
            <select class="form-select" id="pShip" required>
              <option value="office">مكتب (Stop‑Desk)</option>
              <option value="home">منزل (Domicile)</option>
            </select></div>
          <div class="col-md-6"><label class="form-label">صورة المنتج</label>
            <input type="file" class="form-control" id="pImg" accept="image/*" required></div>
          <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">حفظ المنتج</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  /* ----------  التوثيق --------- */
  if(localStorage.getItem('adminLogged') !== 'true'){
    window.location.href = 'admin-portal.html?login=true';
  }

  function logout(){
    localStorage.removeItem('adminLogged');
    window.location.href = 'admin-portal.html?login=true';
  }

  /* ----------  عرض الطلبات -------- */
  function renderOrders(){
    const orders = JSON.parse(localStorage.getItem('orders') || '[]');
    const container = document.getElementById('ordersList');
    if(!orders.length){
      container.innerHTML='<div class="alert alert-warning">لا توجد طلبات حتى الآن.</div>';
      return;
    }
    const rev = [...orders].reverse(); // أحدث أولاً
    container.innerHTML=rev.map(o=>`
      <div class="card mb-3 p-3">
        <div class="d-flex justify-content-between">
          <div>
            <h5>#${o.id} – ${o.fullname}</h5>
            <p class="mb-1"><i class="bi bi-geo-alt"></i> ${o.province} – ${o.city}</p>
            <p class="mb-1"><i class="bi bi-telephone"></i> ${o.phone}</p>
          </div>
          <div class="text-end">
            <p class="fw-bold">${o.total.toLocaleString()} دج</p>
            <small class="text-muted">${o.date}</small>
          </div>
        </div>
        <hr>
        <p class="text-muted"><strong>المنتجات:</strong> ${o.products.map(p=>p.name).join(', ')}</p>
      </div>
    `).join('');
  }
  renderOrders();

  /* ----------  إضافة منتج -------- */
  document.getElementById('addProductForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const imgFile = document.getElementById('pImg').files[0];
    if (!imgFile){ alert('الرجاء رفع صورة للمنتج'); return; }

    const image = await fileToBase64(imgFile);
    const newProduct = {
      id: Date.now(),
      name: document.getElementById('pName').value.trim(),
      price: parseInt(document.getElementById('pPrice').value),
      weight: parseFloat(document.getElementById('pWeight').value),
      shipPoint: document.getElementById('pShip').value,
      desc: document.getElementById('pDesc').value.trim(),
      image
    };

    const list = JSON.parse(localStorage.getItem('products') || '[]');
    list.push(newProduct);
    localStorage.setItem('products', JSON.stringify(list));
    alert('تم إضافة المنتج بنجاح');
    e.target.reset();
  });

  function fileToBase64(file){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.readAsDataURL(file);
      r.onload = () => res(r.result);
      r.onerror = err => rej(err);
    });
  }
</script>
</body>
</html>
